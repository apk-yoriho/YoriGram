<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YoriGram</title>
<style>
:root{--bg:#0f1721;--pan:#17212b;--pan2:#1f2d3d;--acc:#4da3ff;--tx:#eef3f8;--mut:#8196aa;--wp:linear-gradient(160deg,#0f1b2b,#16263a)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{font-size:16px}
body{margin:0;background:#000;color:var(--tx);font:1rem/1.35 system-ui,sans-serif;height:100dvh;overflow:hidden}
button,input,select{font:inherit;color:var(--tx)}button{border:0;cursor:pointer;background:none}
input,select{border:0;outline:0;background:var(--pan);border-radius:14px;padding:13px 15px;width:100%}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.hide{display:none!important}small,.mut{color:var(--mut)}.c{text-align:center}.noanim *{animation:none!important;transition:none!important}
code{background:#ffffff1a;padding:2px 6px;border-radius:6px;word-break:break-all;cursor:pointer}
#app{position:relative;max-width:520px;height:100dvh;margin:auto;background:var(--bg);overflow:hidden}
#page{position:absolute;inset:0;overflow:auto;padding-bottom:110px}
#page[data-d=r]{animation:inr .3s}#page[data-d=l]{animation:inl .3s}
@keyframes inr{from{opacity:0;transform:translateX(28px)}}@keyframes inl{from{opacity:0;transform:translateX(-28px)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes pop{from{opacity:0;transform:scale(.92) translateY(8px)}}
#login,#onb,#ban{position:absolute;inset:0;display:grid;align-content:center;gap:12px;padding:30px;text-align:center;background:radial-gradient(circle at 50% 0,#1b3a63,var(--bg) 60%);z-index:9}
#onb{z-index:25}#ban{z-index:40}
.lg{width:90px;height:90px;border-radius:28px;margin:auto;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#4da3ff,#a06cd5);animation:pop .6s}
.btn{background:var(--acc);color:#fff;border-radius:14px;padding:13px;font-weight:600;display:flex;gap:8px;justify-content:center;align-items:center}.btn.g{background:var(--pan2);color:var(--tx)}.lnk{color:var(--acc)}
.chk{display:flex;gap:10px;align-items:center;text-align:left}
.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;background:var(--bg);z-index:3}
.t1{font-size:1.4rem;font-weight:700;flex:1}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}.ib:active{background:#ffffff1a}
.search{background:var(--pan);border-radius:24px;padding:13px 18px}
.row{display:flex;gap:12px;padding:9px 16px;align-items:center;cursor:pointer;animation:up .35s both;animation-delay:calc(var(--i,0)*40ms)}.row:active{background:var(--pan)}
.rt{flex:1;min-width:0}.rn{display:flex;gap:6px;align-items:center;font-weight:600}.rn span{margin-left:auto;font-weight:400;color:var(--mut);font-size:.8rem}
.rp{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{display:grid;place-items:center;border-radius:50%;object-fit:cover;color:#fff;font-weight:700;flex:none}
.ring{padding:3px;border-radius:50%;display:inline-block}.ring.on{background:conic-gradient(#4da3ff,#a06cd5,#ff6ec4,#4da3ff);cursor:pointer}
.plq{margin:6px 16px 10px;padding:14px;border-radius:16px;background:linear-gradient(135deg,#2b6cb0,#6a4cff);display:flex;gap:12px;align-items:center;color:#fff}.plq div{flex:1}.plq button{background:#fff;color:#2b4cb0;border-radius:12px;padding:9px 14px;font-weight:600}
.fab{position:absolute;right:18px;bottom:98px;width:58px;height:58px;border-radius:20px;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 6px 20px #0006;z-index:4;animation:pop .4s}
.addp{position:absolute;left:50%;bottom:94px;transform:translateX(-50%);z-index:4;background:var(--acc);color:#fff;border-radius:26px;padding:14px 24px;display:flex;gap:8px;align-items:center;font-weight:600;box-shadow:0 6px 20px #0006;animation:pop .4s}
#nav{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));height:66px;border-radius:33px;background:var(--pan2);display:flex;justify-content:space-around;align-items:center;z-index:5;box-shadow:0 8px 28px #0007}
.nb{display:grid;justify-items:center;font-size:.7rem;padding:7px 15px;border-radius:26px;color:var(--mut);transition:.25s}.nb .i{margin-bottom:2px}.nb.on{background:#ffffff14;color:var(--acc)}
.ov{position:absolute;inset:0;background:var(--bg);z-index:6;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.ov.open{transform:none}#subv{z-index:8}#sb2{flex:1;overflow:auto;padding-bottom:30px}
.hd{display:flex;gap:10px;align-items:center;flex:1;min-width:0}.hd b{display:flex;gap:6px;align-items:center}
.chh{display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;background:var(--pan)}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:5px;background:var(--wp)}
.m{max-width:80%;padding:7px 12px 5px;border-radius:18px 18px 18px 6px;background:var(--pan2);align-self:flex-start;word-break:break-word;white-space:pre-wrap}
.m.n{animation:pop .22s}
.m.me{background:var(--acc);background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#6a4cff));color:#fff;border-radius:18px 18px 6px 18px;align-self:flex-end}
.m img{max-width:100%;border-radius:12px;display:block;margin-bottom:3px}.sn{display:block;color:var(--acc);font-weight:600;font-size:.8rem}
.mt{display:block;text-align:right;font-size:.68rem;opacity:.65}.mt b{cursor:pointer;margin-left:4px}
.m.gift{background:none;align-self:center;text-align:center;max-width:none}
#chips{display:flex;gap:8px;padding:6px 10px;overflow:auto;background:var(--bg)}#chips button{background:var(--pan2);border-radius:16px;padding:7px 13px;white-space:nowrap}
#bar{display:flex;gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));align-items:center;background:var(--bg)}
.inp{flex:1;background:var(--pan);border-radius:24px;padding:13px 18px}
.rb{width:48px;height:48px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}.rb.g{background:var(--pan);color:var(--tx)}
.rc{display:flex;align-items:center;gap:10px}.dot{width:11px;height:11px;border-radius:50%;background:#ff4d4d;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
.vm{display:flex;align-items:center;gap:10px;min-width:235px}.vp{width:44px;height:44px;border-radius:50%;background:#fff;color:#2b6cb0;display:grid;place-items:center;flex:none;transition:transform .15s}.vp:active{transform:scale(.9)}
.m:not(.me) .vp{background:var(--acc);color:#fff}
.wf{display:flex;align-items:center;gap:2px;flex:1;height:32px}.wf b{width:3px;border-radius:2px;background:currentColor;opacity:.35;transition:opacity .12s,transform .12s}.wf b.on{opacity:1;transform:scaleY(1.15)}
.bn{height:300px;background-size:cover;background-position:center;position:relative;display:flex;align-items:flex-end;justify-content:center}
.shade{position:absolute;inset:0;background:linear-gradient(#0000,#000a)}
.pc{position:relative;text-align:center;padding-bottom:18px;color:#fff}.pc h2{margin:8px 0 0;display:flex;gap:6px;justify-content:center;align-items:center}.pc small{color:#ffffffb0}.pc .av{border:3px solid #fff3}
.bcam{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:50%;background:#0006;z-index:2;color:#fff;display:grid;place-items:center}
.acts{display:flex;gap:10px;padding:14px 16px}.acts button{flex:1;background:var(--pan);border-radius:16px;padding:12px 6px;display:grid;gap:4px;justify-items:center}
.acts span{font-size:.75rem;color:var(--mut)}
.card{background:var(--pan);border-radius:18px;margin:10px 16px;overflow:hidden}.ir{padding:12px 16px}.ir b{display:block}
.sec{margin:18px 16px 8px}
.tabs{display:flex;gap:6px;margin:14px 16px 10px;background:var(--pan);border-radius:14px;padding:4px}.tabs button{flex:1;padding:9px;border-radius:11px;color:var(--mut)}.tabs .on{background:var(--pan2);color:var(--tx)}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:0 16px}.pt{aspect-ratio:1;background:var(--pan);border-radius:10px;background-size:cover;background-position:center;padding:8px;font-size:.8rem;overflow:hidden;cursor:pointer;animation:pop .3s both}
.gg{display:flex;gap:10px;flex-wrap:wrap;padding:0 16px}.gw{position:relative;cursor:pointer;animation:pop .3s both}.pn{position:absolute;top:6px;right:6px;z-index:2;color:#fff;background:#0007;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.pr{display:flex;gap:14px;padding:16px;align-items:center;cursor:pointer}
.si{display:flex;gap:14px;padding:13px 16px;align-items:center;cursor:pointer}.si:active{background:var(--pan2)}.si b{display:block}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.f{padding:16px;display:grid;gap:10px}.ep{display:grid;justify-items:center;gap:8px;padding:10px}
.seg{display:flex;background:var(--pan);border-radius:14px;margin:10px 16px;padding:4px}.seg button{flex:1;padding:9px;border-radius:11px}.seg .on{background:var(--acc);color:#fff}
.bal{text-align:center;font-size:2rem;font-weight:700;padding:14px}.bal small{display:block;font-size:.8rem;font-weight:400}
.it{display:flex;gap:12px;align-items:center;padding:10px 16px}.it small{display:block}
.it button,.gs button{background:var(--acc);color:#fff;border-radius:12px;padding:8px 12px;margin-top:6px}.it button:disabled,.gs button:disabled{opacity:.4}
.gs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gs>div{text-align:center}
.wps{display:flex;gap:10px}.wps i{flex:1;height:50px;border-radius:12px;cursor:pointer;border:2px solid transparent}.wps i.on{border-color:var(--acc)}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--pan);border-radius:22px 22px 0 0;padding:16px;z-index:11;transform:translateY(105%);transition:.3s;max-height:85%;overflow:auto}
#sheet.open{transform:none}#shade{position:absolute;inset:0;background:#0008;opacity:0;pointer-events:none;transition:.3s;z-index:10}#shade.open{opacity:1;pointer-events:auto}
#zoom,#story{position:absolute;inset:0;background:#000e;z-index:30;display:none;place-items:center}#zoom.open,#story.open{display:grid}#zoom img,#story img{max-width:100%;max-height:100%}
#story p{position:absolute;bottom:50px;left:0;right:0;text-align:center;color:#fff;margin:0;padding:0 20px}#story .ib{position:absolute;top:calc(24px + env(safe-area-inset-top));right:10px;color:#fff}
.sbar{position:absolute;top:calc(12px + env(safe-area-inset-top));left:10px;right:60px;display:flex;gap:4px}.sbar i{flex:1;height:3px;background:#fff4;border-radius:2px;overflow:hidden}.sbar i.d{background:#fff}.sbar i.a:after{content:'';display:block;height:100%;background:#fff;animation:sb 5s linear}
@keyframes sb{from{width:0}to{width:100%}}
#toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,20px);background:#000d;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:92%;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
#toast .pl{color:#5be37d}#toast .mi{color:#ff8a8a}
.fx{position:absolute;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none;background:radial-gradient(#0006,#0000 70%)}
.fxg{width:150px;height:150px;animation:fxp 1.9s both}.fxg svg{width:100%;height:100%}.fxt{position:absolute;top:62%;font-size:1.4rem;font-weight:700;color:#fff;animation:up .6s .3s both}
.fx i{position:absolute;top:55%;left:50%;color:var(--acc);animation:fly 1.7s ease-out both;animation-delay:var(--d)}
@keyframes fxp{0%{transform:scale(0) rotate(-40deg);opacity:0}30%{transform:scale(1.25) rotate(8deg);opacity:1}55%{transform:scale(1)}85%{opacity:1}100%{transform:scale(1.1);opacity:0}}
@keyframes fly{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--x),-300px) scale(1.2) rotate(240deg);opacity:0}}
.gc{text-align:center;padding:12px 10px;border-radius:18px;min-width:140px;background:var(--pan2);position:relative;overflow:hidden}
.gc .ar svg{width:84px;height:84px;display:block;margin:0 auto 4px}.gc.an .ar svg{animation:bounce 1.4s infinite}
.gc.big{min-width:230px;padding:22px}.gc.big .ar svg{width:150px;height:150px}
.gc.nft{background:linear-gradient(145deg,var(--b1),var(--b2));color:#fff;box-shadow:0 0 22px color-mix(in srgb,var(--b1) 55%,transparent)}
.gc.nft small{color:#ffffffd0}.gc.nft .ar{animation:flt 3s ease-in-out infinite}
.gc.nft:after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff60 50%,transparent 70%);transform:translateX(-130%);animation:shine 3.2s infinite;pointer-events:none}
.gc.nft:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 25%,#fff8 0 2px,transparent 3px),radial-gradient(circle at 80% 35%,#fff8 0 2px,transparent 3px),radial-gradient(circle at 60% 80%,#fff8 0 2px,transparent 3px),radial-gradient(circle at 30% 70%,#fff8 0 1.5px,transparent 3px);animation:tw 1.8s infinite}
@keyframes bounce{50%{transform:translateY(-7px) scale(1.08)}}@keyframes flt{50%{transform:translateY(-6px) scale(1.04)}}
@keyframes shine{60%,100%{transform:translateX(130%)}}@keyframes tw{50%{opacity:.25}}
</style></head><body>

<div id="app">
  <div id="login"><div class="lg"><svg class="i" width="46" height="46"><use href="#i-chat"/></svg></div><h1 style="margin:0">YoriGram</h1><small>Быстрый и красивый мессенджер</small>
    <input id="em" type="email" placeholder="Почта" autocomplete="username">
    <input id="code" class="hide" placeholder="Код из письма" inputmode="numeric">
    <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
    <button class="btn" id="go">Войти</button><button class="lnk" id="mode">Войти по коду из почты</button><small id="err" style="color:#ff7b7b"></small></div>
  <div id="onb" class="hide"></div><div id="ban" class="hide"></div>
  <div id="page" class="hide"></div>
  <button class="addp hide" id="addp" onclick="newPost()"><svg class="i" width="22" height="22"><use href="#i-cam"/></svg>Добавить</button>
  <nav id="nav" class="hide">

  const k=hue(p.id),bg=p.banner?`url(${url(p.banner)})`:`linear-gradient(135deg,hsl(${k} 60% 38%),hsl(${(k+60)%360} 60% 26%))`;
  const info=[own&&p.phone?[p.phone,'Телефон']:0,!p.hide_username||own?['@'+p.username,'Имя пользователя']:0,[String(p.uid),'ID'],p.bio?[p.bio,'О себе']:0,p.birthday?[new Date(p.birthday).toLocaleDateString(),'День рождения']:0].filter(Boolean);
  const body=ptab=='posts'?(posts.length?`<div class="pg">${posts.map(x=>`<div class="pt" style="${x.media_path?`background-image:url(${url(x.media_path)})`:''}" onclick="postView(${x.id})">${x.media_path?'':esc(x.body.slice(0,60))}</div>`).join('')}</div>`:'<p class="mut c">Публикаций пока нет</p>')
   :(gl.length?`<div class="gg">${gl.map(u=>`<div class="gw" onclick="gdet(${u.id})">${card(gifts[u.gift_id],u)}${u.pinned?`<span class="pn">${I('pin',13)}</span>`:''}</div>`).join('')}</div>`:'<p class="mut c">Подарков пока нет</p>');
  return `<div class="bn" style="background-image:${bg}"><div class="shade"></div>${own?`<button class="bcam" onclick="pickImg('banner')">${I('img',22)}</button>`:''}
  <div class="pc"><div class="ring ${sts.length?'on':''}" ${sts.length?`onclick="story('${p.id}')"`:''}>${av(p,112)}</div><h2>${esc(nm(p))}${p.is_bot?I('bot',18):''}</h2><small>в сети</small></div></div>
  <div class="acts">${own?`<button onclick="pickImg('avatar')">${I('cam',24)}<span>Выбрать фото</span></button><button onclick="editProfile()">${I('pen',24)}<span>Изменить</span></button><button onclick="go('settings')">${I('cog',24)}<span>Настройки</span></button>`
  :`<button onclick="msgUser('${p.id}')">${I('chat',24)}<span>Написать</span></button><button onclick="giftSheet('${p.id}')">${I('gift',24)}<span>Подарить</span></button>`+(me.is_admin?`<button onclick="adm2('${p.id}')">${I('crown',24)}<span>Админ</span></button>`:'')}</div>
  <div class="card">${info.map(r=>`<div class="ir"><b>${esc(r[0])}</b><small>${r[1]}</small></div>`).join('')}</div>
  <div class="tabs"><button class="${ptab=='posts'?'on':''}" onclick="setPt('posts')">Публикации</button><button class="${ptab=='gifts'?'on':''}" onclick="setPt('gifts')">Подарки · ${gl.length}</button></div>${body}`}
function setPt(x){ptab=x;pvp&&$('subv').classList.contains('open')?peerProfile(pvp):renderProfile()}
async function peerProfile(p){const h=await profileHtml(p,false);sub(nm(p),h);pvp=p}
const openPeer=()=>{const p=pmap[cur.peer];if(p){ptab='posts';peerProfile(p)}};
function story(pid){sq=stc[pid]||[];si=0;showSt()}
function showSt(){clearTimeout(stm);if(si>=sq.length){$('story').classList.remove('open');return}const s=sq[si];
  $('story').innerHTML=`<div class="sbar">${sq.map((_,i)=>`<i class="${i<si?'d':i==si?'a':''}"></i>`).join('')}</div>${s.media_path?`<img src="${url(s.media_path)}">`:''}<p>${esc(s.body)}</p><button class="ib" onclick="event.stopPropagation();si=99;showSt()">${I('x',26)}</button>`;
  $('story').classList.add('open');stm=setTimeout(()=>{si++;showSt()},5000)}
function postView(id){const x=pstc[id];sheet(`${x.media_path?`<img src="${url(x.media_path)}" style="width:100%;border-radius:14px" onclick="zoom(this.src)">`:''}<p style="white-space:pre-wrap">${esc(x.body)}</p><small>${fmt(x.created_at)}</small>${x.author==me.id||me.is_admin?`<div class="f"><button class="btn g" onclick="delPost(${id})">Удалить</button></div>`:''}`)}
async function delPost(id){await sb.from('posts').delete().eq('id',id);sheetClose();tab=='profile'?renderProfile():0}
function newPost(){pf=null;pkind='post';sheet(`<b>Новая публикация</b><div class="seg" style="margin:10px 0"><button class="on" id="pk1" onclick="pk('post')">Публикация</button><button id="pk2" onclick="pk('story')">История (24 ч)</button></div>
  <div class="f" style="padding:0"><input id="pb" placeholder="Подпись"><button class="btn g" onclick="pickPf()">${I('img',20)}<span id="pfn">Прикрепить фото</span></button><button class="btn" onclick="pubPost()">Опубликовать</button></div>`)}
function pk(k){pkind=k;$('pk1').classList.toggle('on',k=='post');$('pk2').classList.toggle('on',k=='story')}
function pickPf(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{pf=i.files[0];$('pfn').textContent=pf?pf.name.slice(0,24):'Прикрепить фото'};i.click()}
async function pubPost(){const body=$('pb').value.trim();if(!pf&&!body)return toast('Добавь текст или фото');if(pkind=='story'&&!pf)return toast('Для истории нужно фото');
  let path=null;if(pf){toast('Загружаю…');path=await upload(await shrink(pf,1280),'jpg');if(!path)return}
  const {error}=await sb.from('posts').insert({author:me.id,kind:pkind,body,media_path:path});if(error)return fail(error);sheetClose();toast('Опубликовано');renderProfile()}
function pickImg(kind){const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=async()=>{const f=i.files[0];if(!f)return;toast('Загружаю…');const p=await upload(await shrink(f,kind=='banner'?1280:512),'jpg');if(!p)return;
    const {error}=await sb.from('profiles').update({[kind]:p}).eq('id',me.id);if(error)return fail(error);await loadMe();toast('Готово');editing?editProfile():go(tab)};i.click()}
function editProfile(){editing=true;sub('Изменить профиль',`<div class="ep">${av(me,96)}<div style="display:flex;gap:10px"><button class="btn g" onclick="pickImg('avatar')">${I('cam',18)} Фото</button><button class="btn g" onclick="pickImg('banner')">${I('img',18)} Баннер</button></div></div>
  <div class="f"><input id="f1" placeholder="Имя" value="${esc(me.display_name)}"><input id="f2" placeholder="username (a-z, 0-9, _)" value="${esc(me.username)}">
  <input id="f3" placeholder="О себе" value="${esc(me.bio)}"><input id="f4" placeholder="Телефон" value="${esc(me.phone)}">
  <small>День рождения</small><input id="f5" type="date" value="${me.birthday||''}"><button class="btn" onclick="saveProfile()">Сохранить</button></div>`)}
async function saveProfile(){const {error}=await sb.from('profiles').update({display_name:$('f1').value,username:$('f2').value.toLowerCase(),bio:$('f3').value,phone:$('f4').value,birthday:$('f5').value||null}).eq('id',me.id);
  if(error)return toast(/unique/.test(error.message)?'Username занят':error.message);await loadMe();subClose();go(tab);toast('Сохранено')}
function privacy(){sub('Конфиденциальность',`<div class="card"><div class="ir"><b>${me.uid}</b><small>Твой ID</small></div></div><div class="f"><label class="chk"><input type="checkbox" style="width:auto" ${me.hide_username?'checked':''} onchange="setHide(this.checked)"> Скрыть username</label><small>Тебя смогут найти по имени или ID.</small></div>`)}
async function setHide(v){const {error}=await sb.from('profiles').update({hide_username:v}).eq('id',me.id);error?fail(error):loadMe()}
function chatSettings(){sub('Настройки чатов',`<div class="f"><small>Тема</small><select onchange="setS('th',this.value)"><option value="dark">Тёмная</option><option value="light">Светлая</option><option value="blue">Синяя</option></select>
  <small>Цвет акцента</small><input type="color" value="${S.acc||'#4da3ff'}" oninput="setS('acc',this.value)">
  <small>Размер текста</small><input type="range" min="14" max="20" value="${S.fs||16}" oninput="setS('fs',+this.value)">
  <small>Обои чата</small><div class="wps">${WP.map((w,i)=>`<i class="${(S.wp||0)==i?'on':''}" style="background:${w}" onclick="setS('wp',${i});chatSettings()"></i>`).join('')}</div>
  <label class="chk"><input type="checkbox" style="width:auto" ${S.na?'checked':''} onchange="setS('na',this.checked)"> Отключить анимации</label></div>`);
  document.querySelector('#sb2 select').value=S.th||'dark'}

/* ---------- чат ---------- */
const openChatId=id=>openChat(chats.find(c=>c.id==id));
function openChat(c){cur=c;maxId=0;const dm=c.kind=='dm',pr=pmap[c.peer]||{};
  $('chh').innerHTML=`<button class="ib" onclick="closeChat()">${I('back',24)}</button><div class="hd" ${dm?'onclick="openPeer()"':''}>${cav(c,42)}<div style="min-width:0"><b>${esc(ct(c))}${pr.is_bot?I('bot',15):''}</b><small>${dm?(pr.is_bot?'бот':'в сети'):c.kind=='group'?'группа':'канал'}</small></div></div>`
   +(dm?`<button class="ib" onclick="giftSheet(cur.peer)">${I('gift',24)}</button>`:'')+(!dm&&(c.owner==me.id||me.is_admin)?`<button class="ib" onclick="addMember()">${I('users',24)}</button>`:'');
  const bf=dm&&c.peer==BFID;$('chips').classList.toggle('hide',!bf);if(bf)$('chips').innerHTML=['/newbot ','/mybots','/help'].map(x=>`<button onclick="chip('${x}')">${x}</button>`).join('');
  $('bar').classList.toggle('hide',c.kind=='channel'&&c.owner!=me.id);bar();$('msgs').innerHTML='';$('chatv').classList.add('open');loadMsgs()}
function chip(x){if(x.endsWith(' ')){$('txt').value=x;$('txt').focus();rbIcon()}else put(x)}
function closeChat(){cur=null;$('chatv').classList.remove('open');loadChats()}
const vm=m=>{const d=+m.body||1;return `<div class="vm" data-d="${d}"><button class="vp" onclick="vplay(this,'${m.media_path}')">${I('play',20)}</button><div class="wf">${Array.from({length:36},(_,i)=>`<b style="height:${6+((m.id*37+i*53)%22)}px"></b>`).join('')}</div><small style="color:inherit;opacity:.75">${Math.floor(d/60)}:${String(d%60).padStart(2,'0')}</small></div>`};
async function loadMsgs(){
  const id=cur.id,{data}=await sb.from('messages').select().eq('chat_id',id).order('id').limit(300);
  if(!cur||cur.id!=id)return;await prof(data.map(m=>m.sender));
  const ids=data.map(m=>m.user_gift_id).filter(Boolean);
  if(ids.length){const {data:u}=await sb.from('user_gifts').select().in('id',ids);(u||[]).forEach(x=>ugc[x.id]=x)}
  const box=$('msgs');box.innerHTML='';
  data.forEach(m=>{const mine=m.sender==me.id,d=document.createElement('div');d.className='m'+(mine?' me':'')+(maxId&&m.id>maxId?' n':'');
    let h=cur.kind!='dm'&&!mine?`<small class="sn">${esc(nm(pmap[m.sender]))}</small>`:'';
    if(m.kind=='text')h+=esc(m.body).replace(/(\d{9,10}:[a-f0-9]{32,40})/g,'<code onclick="cp(this.textContent)">$1</code>');
    else if(m.kind=='photo')h+=`<img src="${url(m.media_path)}" onclick="zoom(this.src)">`;
    else if(m.kind=='voice')h+=vm(m);
    else{const u=ugc[m.user_gift_id];d.classList.add('gift');d.onclick=()=>u&&gdet(u.id);h+=(u?card(gifts[u.gift_id],u):'<small>Подарок продан</small>')+`<small style="display:block;margin-top:4px">${mine?'Ты отправил подарок':'Тебе подарили подарок'}</small>`}
    h+=`<span class="mt">${fmt(m.created_at)}${mine||me.is_admin?` <b onclick="event.stopPropagation();del(${m.id})">${I('x',12)}</b>`:''}</span>`;d.innerHTML=h;box.append(d)});
  maxId=data.length?data[data.length-1].id:0;box.scrollTop=1e9}
const del=async id=>{await sb.from('messages').delete().eq('id',id);loadMsgs()};
async function put(body,kind='text',path=null){const {error}=await sb.from('messages').insert({chat_id:cur.id,sender:me.id,kind,body,media_path:path});if(error)fail(error)}
let rec,chunks,t0,tm,cancel;
function bar(){if(rec&&rec.state=='recording'){$('bar').innerHTML=`<button class="rb g" onclick="recStop(0)">${I('x',22)}</button><div class="inp rc"><i class="dot"></i><span id="rt">0:00</span></div><button class="rb" onclick="recStop(1)">${I('send',22)}</button>`}
  else{$('bar').innerHTML=`<button class="rb g" onclick="$('file').click()">${I('clip',22)}</button><input class="inp" id="txt" placeholder="Сообщение" oninput="rbIcon()" onkeydown="if(event.key=='Enter')sendTxt()"><button class="rb" id="rb" onclick="rbGo()">${I('mic',22)}</button>`}}
const rbIcon=()=>{$('rb').innerHTML=$('txt').value.trim()?I('send',22):I('mic',22)};
function rbGo(){if($('txt').value.trim())sendTxt();else recStart()}
function sendTxt(){const b=$('txt').value.trim();if(!b||!cur)return;$('txt').value='';rbIcon();put(b)}
$('file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!cur)return;toast('Отправляю…');const p=await upload(await shrink(f,1280),'jpg');if(p)put('','photo',p)};
async function recStart(){try{const st=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(st);chunks=[];cancel=false;
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=async()=>{st.getTracks().forEach(t=>t.stop());clearInterval(tm);bar();if(cancel)return;const d=Math.max(1,Math.round((Date.now()-t0)/1000));
    const b=new Blob(chunks,{type:rec.mimeType});const p=await upload(b,/mp4/.test(rec.mimeType)?'m4a':'webm');if(p)put(String(d),'voice',p)};
  rec.start();t0=Date.now();bar();tm=setInterval(()=>{const s=Math.round((Date.now()-t0)/1000),e=$('rt');if(e)e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},250)}catch(e){toast('Нет доступа к микрофону')}}
const recStop=ok=>{cancel=!ok;rec.stop()};
let au,aub;
function vplay(el,path){const w=el.closest('.vm'),bars=[...w.querySelectorAll('.wf b')],d=+w.dataset.d;
  if(au&&aub===el){au.paused?au.play():au.pause();return}
  if(au){au.pause();aub.innerHTML=I('play',20)}
  const a=au=new Audio(url(path));aub=el;
  a.ontimeupdate=()=>bars.forEach((b,i)=>b.classList.toggle('on',i/bars.length<a.currentTime/d));
  a.onplay=()=>el.innerHTML=I('pause',20);a.onpause=()=>el.innerHTML=I('play',20);
  a.onended=()=>{el.innerHTML=I('play',20);bars.forEach(b=>b.classList.remove('on'));au=null};a.play()}

/* ---------- чаты, группы ---------- */
function newChat(){sub('Новый чат',`<div class="f"><select id="nk"><option value="group">Группа</option><option value="channel">Канал</option></select><input id="nt" placeholder="Название"><button class="btn" onclick="mk()">Создать</button></div>`)}
async function mk(){const {data,error}=await sb.rpc('create_chat',{k:$('nk').value,t:$('nt').value||'Без названия'});if(error)return fail(error);subClose();await loadChats();openChatId(data)}
async function addMember(){const u=prompt('@username участника:');if(!u)return;const {error}=await sb.rpc('add_member',{cid:cur.id,uname:u.replace('@','')});error?fail(error):toast('Добавлен')}
/* ---------- подарки, NFT ---------- */
function giftSheet(uid){sheet(`<b>Выбери подарок</b><div class="gs" style="margin-top:12px">`+Object.values(gifts).map(g=>{const out=g.supply&&g.sold>=g.supply;
  return `<div>${card(g,null)}<button ${out?'disabled':''} onclick="giftSend('${uid}',${g.id})">${out?'Нет в наличии':g.price+' ✚'}</button></div>`}).join('')+`</div>`)}
async function giftSend(uid,gid){const {error}=await sb.rpc('send_gift',{to_user:uid,gift:gid});if(error)return fail(error);sheetClose();fx(gifts[gid],gifts[gid].price);await loadMe();if(cur)loadMsgs();const {data:g}=await sb.from('gifts').select().order('id');g.forEach(x=>gifts[x.id]=x)}
async function giftToName(gid){const u=prompt('Кому? @username или ID');if(!u)return;const q=u.replace('@','').trim().toLowerCase();
  const {data}=await sb.from('profiles').select('id').or(/^\d+$/.test(q)?`uid.eq.${q}`:`username.eq.${q}`).maybeSingle();if(!data)return toast('Не найден');giftSend(data.id,gid)}
function gdet(id){const u=ugc[id];if(!u)return;const g=gifts[u.gift_id],own=u.owner==me.id,from=pmap[u.from_user];let b='';
  if(own){b+=`<button class="btn g" onclick="act2('pin_gift',{ug:${id},pin:${!u.pinned}})">${I('pin',18)} ${u.pinned?'Открепить':'Закрепить в профиле'}</button>`;
    if(!u.upgraded&&g.upgrade_price)b+=`<button class="btn" onclick="act2('upgrade_gift',{ug:${id}})">Улучшить до NFT · ${g.upgrade_price} ${I('cross',15)}</button>`;
    if(!u.upgraded)b+=`<button class="btn g" onclick="act2('sell_gift',{ug:${id}})">Продать системе · 13 ${I('cross',15)}</button>`;
    if(u.upgraded)b+=u.sale_price?`<button class="btn g" onclick="lst(${id},0)">Снять с рынка (${u.sale_price} ✚)</button>`:`<button class="btn" onclick="lst(${id})">Выставить на рынок NFT</button>`}
  else if(u.sale_price)b+=`<button class="btn" onclick="act2('buy_gift',{ug:${id}})">Купить · ${u.sale_price} ${I('cross',15)}</button>`;
  sheet(`<div class="c" style="display:grid;justify-items:center;gap:8px">${card(g,u,true)}${from?`<small>От: ${esc(nm(from))}</small>`:''}${u.upgraded?'<small>NFT нельзя продать системе, только на рынке</small>':''}</div><div class="f" style="padding:14px 0 0">${b}</div>`)}
async function act2(f,a){const {error}=await sb.rpc(f,a);if(error)return fail(error);sheetClose();await loadMe();hubOpen?hub(hubT):go(tab)}
const lst=(id,p)=>{const v=p===0?0:+prompt('Цена в крестиках:');if(v>=0)act2('list_gift',{ug:id,price:v})};
async function hub(t='shop'){hubT=t;await loadMe();let body='';
  if(t=='shop')body=Object.values(gifts).map(g=>`<div class="it">${card(g,null)}<div><b>${g.price} ✚</b><small>${g.supply?`Осталось ${g.supply-g.sold} из ${g.supply}`:'Без лимита'}</small>${g.upgrade_price?`<small>NFT за ${g.upgrade_price} ✚</small>`:''}<button onclick="giftToName(${g.id})" ${g.supply&&g.sold>=g.supply?'disabled':''}>Подарить…</button></div></div>`).join('');
  if(t=='mine'){const {data}=await sb.from('user_gifts').select().eq('owner',me.id).order('id',{ascending:false});(data||[]).forEach(u=>ugc[u.id]=u);
    body=(data||[]).length?`<div class="gg">${data.map(u=>`<div class="gw" onclick="gdet(${u.id})">${card(gifts[u.gift_id],u)}${u.pinned?`<span class="pn">${I('pin',13)}</span>`:''}</div>`).join('')}</div>`:'<p class="mut c">У тебя пока нет подарков</p>'}
  if(t=='market'){const {data}=await sb.from('user_gifts').select().not('sale_price','is',null).neq('owner',me.id);(data||[]).forEach(u=>ugc[u.id]=u);
    body=(data||[]).length?`<div class="gg">${data.map(u=>`<div class="gw" onclick="gdet(${u.id})">${card(gifts[u.gift_id],u)}<div class="c"><b>${u.sale_price} ✚</b></div></div>`).join('')}</div>`:'<p class="mut c">На рынке пока пусто</p>'}
  sub('Крестики и подарки',`<div class="bal">${I('cross',26)} ${me.balance}<small>Пополнение пока выдаёт владелец</small></div><div class="seg">${[['shop','Магазин'],['mine','Мои'],['market','Рынок NFT']].map(x=>`<button class="${t==x[0]?'on':''}" onclick="hub('${x[0]}')">${x[1]}</button>`).join('')}</div>${body}`);hubOpen=true}

/* ---------- консоль владельца ---------- */
function admin(){sub('Консоль владельца',`<div class="f"><input id="aq" placeholder="ID или @username" onkeydown="if(event.key=='Enter')adm()"><button class="btn" onclick="adm()">Найти</button><div id="ar" style="display:grid;gap:10px"></div></div>`)}
function adm2(id){admin();$('aq').value=pmap[id].uid;adm()}
async function adm(){const q=$('aq').value.trim().replace('@','');const {data,error}=await sb.rpc('admin_find',{q});if(error)return fail(error);const p=data&&data[0];if(!p)return $('ar').innerHTML='<p class="mut">Не найден</p>';
  pmap[p.id]=Object.assign(pmap[p.id]||{},p);
  $('ar').innerHTML=`<div class="card" style="margin:0"><div class="it">${av(p,48)}<div><b>${esc(nm(p))}</b><small>ID ${p.uid} · @${esc(p.username)}</small><small>${I('cross',12)} ${p.balance}${p.banned?' · ЗАБАНЕН':''}</small></div></div></div>
  <input id="aa" type="number" placeholder="Крестики (+ или −)"><button class="btn" onclick="aDo('admin_balance',{target:'${p.id}',amount:+$('aa').value})">Изменить баланс</button>
  <button class="btn g" onclick="aDo('admin_ban',{target:'${p.id}',flag:${!p.banned}})">${p.banned?'Разбанить':'Забанить'}</button>
  <select id="ag">${Object.values(gifts).map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select>
  <button class="btn g" onclick="aDo('admin_gift',{target:'${p.id}',gift:+$('ag').value,nft:false})">Выдать подарок</button>
  <button class="btn g" onclick="aDo('admin_gift',{target:'${p.id}',gift:+$('ag').value,nft:true})">Выдать NFT</button>
  <button class="btn g" onclick="aDel('${p.id}')">Удалить пользователя</button>`}
async function aDo(f,a){const {error}=await sb.rpc(f,a);if(error)return fail(error);toast('Готово');adm()}
async function aDel(id){if(!confirm('Удалить пользователя насовсем?'))return;const {error}=await sb.rpc('admin_remove',{target:id});error?fail(error):(toast('Удалён'),$('ar').innerHTML='')}

sb.auth.getSession().then(({data})=>data.session&&start());
</script></body></html>

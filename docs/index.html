<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YoriGram</title>
<style>
:root{--bg:#0f1721;--pan:#17212b;--pan2:#1f2d3d;--acc:#4da3ff;--tx:#eef3f8;--mut:#8196aa;--wp:linear-gradient(160deg,#0f1b2b,#16263a)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{font-size:16px}
body{margin:0;background:#000;color:var(--tx);font:1rem/1.35 system-ui,sans-serif;height:100dvh;overflow:hidden}
button,input,select{font:inherit;color:var(--tx)}button{border:0;cursor:pointer;background:none}
input,select{border:0;outline:0;background:var(--pan);border-radius:14px;padding:13px 15px;width:100%}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.hide{display:none!important}small,.mut{color:var(--mut)}.c{text-align:center}.noanim *{animation:none!important;transition:none!important}
code{background:#ffffff1a;padding:2px 6px;border-radius:6px;word-break:break-all;cursor:pointer}
#app{position:relative;max-width:520px;height:100dvh;margin:auto;background:var(--bg);overflow:hidden}
#page{position:absolute;inset:0;overflow:auto;padding-bottom:110px}
#page[data-d=r]{animation:inr .3s}#page[data-d=l]{animation:inl .3s}
@keyframes inr{from{opacity:0;transform:translateX(28px)}}@keyframes inl{from{opacity:0;transform:translateX(-28px)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes pop{from{opacity:0;transform:scale(.92) translateY(8px)}}
#login,#onb,#ban{position:absolute;inset:0;display:grid;align-content:center;gap:12px;padding:30px;text-align:center;background:radial-gradient(circle at 50% 0,#1b3a63,var(--bg) 60%);z-index:9}
#onb{z-index:25}#ban{z-index:40}
.lg{width:90px;height:90px;border-radius:28px;margin:auto;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#4da3ff,#a06cd5);animation:pop .6s}
.btn{background:var(--acc);color:#fff;border-radius:14px;padding:13px;font-weight:600;display:flex;gap:8px;justify-content:center;align-items:center}.btn.g{background:var(--pan2);color:var(--tx)}.lnk{color:var(--acc)}
.chk{display:flex;gap:10px;align-items:center;text-align:left}
.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;background:var(--bg);z-index:3}
.t1{font-size:1.4rem;font-weight:700;flex:1}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}.ib:active{background:#ffffff1a}
.search{background:var(--pan);border-radius:24px;padding:13px 18px}
.row{display:flex;gap:12px;padding:9px 16px;align-items:center;cursor:pointer;animation:up .35s both;animation-delay:calc(var(--i,0)*40ms)}.row:active{background:var(--pan)}

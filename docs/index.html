.btn{background:var(--acc);color:#fff;border-radius:14px;padding:13px;font-weight:600;display:flex;gap:8px;justify-content:center;align-items:center}.btn.g{background:var(--pan2);color:var(--tx)}.lnk{color:var(--acc)}
.chk{display:flex;gap:10px;align-items:center;text-align:left}

.nb{display:grid;justify-items:center;font-size:.7rem;padding:7px 15px;border-radius:26px;color:var(--mut);transition:.25s}.nb .i{margin-bottom:2px}.nb.on{background:#ffffff14;color:var(--acc)}
.ov{position:absolute;inset:0;background:var(--bg);z-index:6;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.ov.open{transform:none}#subv{z-index:8}#sb2{flex:1;overflow:auto;padding-bottom:30px}
.hd{display:flex;gap:10px;align-items:center;flex:1;min-width:0}.hd b{display:flex;gap:6px;align-items:center}
.chh{display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;background:var(--pan)}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:5px;background:var(--wp)}
.m{max-width:80%;padding:7px 12px 5px;border-radius:var(--br,18px) var(--br,18px) var(--br,18px) 6px;background:var(--pan2);align-self:flex-start;word-break:break-word;white-space:pre-wrap}
.m.n{animation:pop .22s}
.m.me{background:var(--acc);background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#6a4cff));color:#fff;border-radius:var(--br,18px) var(--br,18px) 6px var(--br,18px);align-self:flex-end}
.m img{max-width:100%;border-radius:12px;display:block;margin-bottom:3px}.sn{display:block;color:var(--acc);font-weight:600;font-size:.8rem}
.mt{display:block;text-align:right;font-size:.68rem;opacity:.65}.mt b{cursor:pointer;margin-left:4px}
.m.gift{background:none;align-self:center;text-align:center;max-width:none}
#chips{display:flex;gap:8px;padding:6px 10px;overflow:auto;background:var(--bg)}#chips button{background:var(--pan2);border-radius:16px;padding:7px 13px;white-space:nowrap}
#bar{display:flex;gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));align-items:center;background:var(--bg)}
.inp{flex:1;background:var(--pan);border-radius:24px;padding:13px 18px}
.rb{width:48px;height:48px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}.rb.g{background:var(--pan);color:var(--tx)}
.rc{display:flex;align-items:center;gap:10px}.dot{width:11px;height:11px;border-radius:50%;background:#ff4d4d;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
.vm{display:flex;align-items:center;gap:10px;min-width:235px}.vp{width:44px;height:44px;border-radius:50%;background:#fff;color:#2b6cb0;display:grid;place-items:center;flex:none;transition:transform .15s}.vp:active{transform:scale(.9)}
.m:not(.me) .vp{background:var(--acc);color:#fff}
.wf{display:flex;align-items:center;gap:2px;flex:1;height:32px}.wf b{width:3px;border-radius:2px;background:currentColor;opacity:.35;transition:opacity .12s,transform .12s}.wf b.on{opacity:1;transform:scaleY(1.15)}
.bn{height:300px;background-size:cover;background-position:center;position:relative;display:flex;align-items:flex-end;justify-content:center}
.shade{position:absolute;inset:0;background:linear-gradient(#0000,#000a)}
.pc{position:relative;text-align:center;padding-bottom:18px;color:#fff}.pc h2{margin:8px 0 0;display:flex;gap:6px;justify-content:center;align-items:center}.pc small{color:#ffffffb0}.pc .av{border:3px solid #fff3}
.bcam{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:50%;background:#0006;z-index:2;color:#fff;display:grid;place-items:center}
.acts{display:flex;gap:10px;padding:14px 16px}.acts button{flex:1;background:var(--pan);border-radius:16px;padding:12px 6px;display:grid;gap:4px;justify-items:center}

.card{background:var(--pan);border-radius:18px;margin:10px 16px;overflow:hidden}.ir{padding:12px 16px}.ir b{display:block}
.sec{margin:18px 16px 8px}
.tabs{display:flex;gap:6px;margin:14px 16px 10px;background:var(--pan);border-radius:14px;padding:4px}.tabs button{flex:1;padding:9px;border-radius:11px;color:var(--mut)}.tabs .on{background:var(--pan2);color:var(--tx)}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:0 16px}.pt{aspect-ratio:1;background:var(--pan);border-radius:10px;background-size:cover;background-position:center;padding:8px;font-size:.8rem;overflow:hidden;cursor:pointer;animation:pop .3s both}
.gg{display:flex;gap:10px;flex-wrap:wrap;padding:0 16px}.gw{position:relative;cursor:pointer;animation:pop .3s both}.pn{position:absolute;top:6px;right:6px;z-index:2;color:#fff;background:#0007;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}

.si{display:flex;gap:14px;padding:13px 16px;align-items:center;cursor:pointer}.si:active{background:var(--pan2)}.si b{display:block}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.f{padding:16px;display:grid;gap:10px}.ep{display:grid;justify-items:center;gap:8px;padding:10px}

.it{display:flex;gap:12px;align-items:center;padding:10px 16px}.it small{display:block}
.it button,.gs button{background:var(--acc);color:#fff;border-radius:12px;padding:8px 12px;margin-top:6px}.it button:disabled,.gs button:disabled{opacity:.4}
.gs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gs>div{text-align:center}
.wps{display:flex;gap:10px}.wps i{flex:1;height:50px;border-radius:12px;cursor:pointer;border:2px solid transparent}.wps i.on{border-color:var(--acc)}

@keyframes fly{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--x),-300px) scale(1.2) rotate(240deg);opacity:0}}
.gc{text-align:center;padding:12px 10px;border-radius:18px;min-width:140px;background:var(--pan2);position:relative;overflow:hidden}
.gc .ar svg{width:84px;height:84px;display:block;margin:0 auto 4px}
.gc.big{min-width:230px;padding:22px}.gc.big .ar svg{width:150px;height:150px}

.gc.nft small{color:#ffffffd0}.gc.nft .ar{animation:flt 3s ease-in-out infinite}

.gc.nft:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 25%,#fff8 0 2px,transparent 3px),radial-gradient(circle at 80% 35%,#fff8 0 2px,transparent 3px),radial-gradient(circle at 60% 80%,#fff8 0 2px,transparent 3px),radial-gradient(circle at 30% 70%,#fff8 0 1.5px,transparent 3px);animation:tw 1.8s infinite}
@keyframes bounce{50%{transform:translateY(-7px) scale(1.08)}}@keyframes flt{50%{transform:translateY(-6px) scale(1.04)}}
@keyframes shine{60%,100%{transform:translateX(130%)}}@keyframes tw{50%{opacity:.25}}

#login{z-index:20}.row,.m{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.m:active{filter:brightness(1.15)}
.m.rm{transition:.28s;max-height:0!important;opacity:0;transform:scale(.7);padding-top:0;padding-bottom:0;margin:-3px 0;overflow:hidden}
.menu{display:grid}.menu button{display:flex;gap:14px;align-items:center;padding:14px 8px;text-align:left;border-radius:12px;font-size:1.02rem}.menu button:active{background:var(--pan2)}
.compact .row{padding:4px 16px}.pi{color:var(--mut);margin-left:4px}
.gc .ar svg{filter:drop-shadow(0 4px 6px #0005)}
.a-bear svg,.a-rose svg{animation:sway 2.8s ease-in-out infinite;transform-origin:50% 95%}
.a-cake svg,.a-diamond svg,.a-v2 svg{animation:bob 2.4s ease-in-out infinite}
.a-cake .flame{animation:flick .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.sp{animation:spk 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.sp.b{animation-delay:.8s}
.a-cross svg{animation:pulse 1.8s ease-in-out infinite}.a-open svg{animation:wob 2.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes flick{from{transform:scale(1,.85) rotate(-4deg)}to{transform:scale(.9,1.15) rotate(4deg)}}
@keyframes spk{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
@keyframes pulse{50%{transform:scale(1.08)}}@keyframes wob{25%{transform:rotate(-6deg) scale(1.04)}75%{transform:rotate(6deg) scale(1.04)}}
.gc.nft.p1:before{background:repeating-linear-gradient(45deg,#ffffff18 0 6px,transparent 6px 14px);animation:none}
.gc.nft.p2:before{background:repeating-radial-gradient(circle at 50% 45%,#ffffff24 0 4px,transparent 4px 16px);animation:none}
.gc.nft.p3:before{background:radial-gradient(#ffffff48 1.5px,transparent 2px);background-size:16px 16px;animation:none}

async function loadChats(){
  const {data}=await sb.from('members').select('chats(id,kind,title,owner)').eq('user_id',me.id);
  chats=(data||[]).map(x=>x.chats).filter(Boolean);
  const dm=chats.filter(c=>c.kind=='dm').map(c=>c.id);
  if(dm.length){const {data:o}=await sb.from('members').select('chat_id,user_id').in('chat_id',dm).neq('user_id',me.id);
    await prof((o||[]).map(x=>x.user_id));(o||[]).forEach(x=>{const c=chats.find(c=>c.id==x.chat_id);if(c)c.peer=x.user_id})}
  const {data:ms}=await sb.from('messages').select('id,chat_id,kind,body,created_at').order('id',{ascending:false}).limit(300);
  last={};(ms||[]).forEach(m=>{if(!last[m.chat_id])last[m.chat_id]=m});
  await Promise.all(chats.filter(c=>c.kind=='dm'&&!last[c.id]).map(async c=>{const {data:x}=await sb.from('messages').select('id,chat_id,kind,body,created_at').eq('chat_id',c.id).order('id',{ascending:false}).limit(1);if(x&&x[0])last[c.id]=x[0]}));

  if(tab=='chats')renderChats()}

   :(gl.length?`<div class="gg">${gl.map(u=>`<div class="gw" onclick="gdet(${u.id})">${card(gifts[u.gift_id],u)}${u.pinned?`<span class="pn">${I('pin',13)}</span>`:''}</div>`).join('')}</div>`:'<p class="mut c">Подарков пока нет</p>');

async function recStart(){try{const st=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(st);chunks=[];cancel=false;
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=async()=>{st.getTracks().forEach(t=>t.stop());clearInterval(tm);bar();if(cancel)return;const d=Math.max(1,Math.round((Date.now()-t0)/1000));
    const b=new Blob(chunks,{type:rec.mimeType});const p=await upload(b,/mp4/.test(rec.mimeType)?'m4a':'webm');if(p)put(String(d),'voice',p)};
  rec.start();t0=Date.now();bar();tm=setInterval(()=>{const s=Math.round((Date.now()-t0)/1000),e=$('rt');if(e)e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},250)}catch(e){toast('Нет доступа к микрофону')}}

let au,aub;
function vplay(el,path){const w=el.closest('.vm'),bars=[...w.querySelectorAll('.wf b')],d=+w.dataset.d;
  if(au&&aub===el){au.paused?au.play():au.pause();return}
  if(au){au.pause();aub.innerHTML=I('play',20)}
  const a=au=new Audio(url(path));aub=el;
  a.ontimeupdate=()=>bars.forEach((b,i)=>b.classList.toggle('on',i/bars.length<a.currentTime/d));
  a.onplay=()=>el.innerHTML=I('pause',20);a.onpause=()=>el.innerHTML=I('play',20);
  a.onended=()=>{el.innerHTML=I('play',20);bars.forEach(b=>b.classList.remove('on'));au=null};a.play()}

    h.className='hrt';h.textContent=q;h.style.left=(r.left+r.width/2)+'px';h.style.top=(r.top+r.height/2)+'px';document.body.append(h);setTimeout(()=>h.remove(),900);
    S.vb!==0&&navigator.vibrate&&navigator.vibrate(10);react(id,q,true)}
  else{dtT=now;dtId=id}});

/* видео-кружки */
let cst,crec,cch,ct0,ctm;
async function circStart(){try{cst=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:480,height:480},audio:true})}catch(e){return toast('Нет доступа к камере')}
  const o=document.createElement('div');o.className='cc';o.id='cc';o.innerHTML=`<video autoplay muted playsinline></video><b id="cct">0:00</b><div style="display:flex;gap:22px"><button class="rb g" onclick="circStop(0)">${I('x',22)}</button><button class="rb" onclick="circStop(1)">${I('send',22)}</button></div>`;
  $('app').append(o);o.querySelector('video').srcObject=cst;crec=new MediaRecorder(cst);cch=[];crec.ondataavailable=e=>cch.push(e.data);crec.start();ct0=Date.now();
  ctm=setInterval(()=>{const s=Math.round((Date.now()-ct0)/1000);$('cct').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s>=60)circStop(1)},300)}
function circStop(ok){if(!crec||crec.state=='inactive')return;clearInterval(ctm);const d=Math.max(1,Math.round((Date.now()-ct0)/1000)),mt=crec.mimeType;
  crec.onstop=async()=>{cst.getTracks().forEach(t=>t.stop());$('cc')&&$('cc').remove();if(!ok||!cur)return;toast('Отправляю…');const p=await upload(new Blob(cch,{type:mt}),/mp4/.test(mt)?'mp4':'webm');if(p)put(String(d),'circle',p)};crec.stop()}

/* аудиозвонки */
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};let pc,cpeer,cstr,cq=[],coffer,sch={};
async function sig(to,p){let c=sch[to];if(!c){c=sch[to]=sb.channel('call:'+to);await new Promise(r=>c.subscribe(s=>s=='SUBSCRIBED'&&r()))}c.send({type:'broadcast',event:'sig',payload:{...p,from:me.id}})}
function callUI(txt,inc){let o=$('call');if(!o){o=document.createElement('div');o.id='call';o.className='cc';o.innerHTML='<audio id="ra" autoplay></audio><div id="cn"></div><div id="cb" style="display:flex;gap:30px"></div>';$('app').append(o)}
  const p=pmap[cpeer];$('cn').innerHTML=`<div style="display:grid;justify-items:center;gap:10px;color:#fff">${av(p,110)}<h2 style="margin:0">${esc(nm(p))}</h2><small style="color:#fffa">${txt}</small></div>`;
  $('cb').innerHTML=(inc?`<button class="rb" style="background:#2fb457;width:64px;height:64px" onclick="callAccept()">${I('phone',28)}</button>`:'')+`<button class="rb" style="background:#e5484d;width:64px;height:64px" onclick="callEnd(1)">${I('x',28)}</button>`}
function newPC(){pc=new RTCPeerConnection(ICE);pc.onicecandidate=e=>e.candidate&&sig(cpeer,{t:'ice',c:e.candidate});pc.ontrack=e=>{$('ra').srcObject=e.streams[0]};
  pc.onconnectionstatechange=()=>{if(!pc)return;if(pc.connectionState=='connected')callUI('Разговор');else if(/failed|disconnected/.test(pc.connectionState))callEnd(0)}}
async function callStart(){if(cpeer||!cur)return;cpeer=cur.peer;
  try{cstr=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){cpeer=null;return toast('Нет доступа к микрофону')}
  newPC();cstr.getTracks().forEach(t=>pc.addTrack(t,cstr));callUI('Звоним…');await pc.setLocalDescription(await pc.createOffer());sig(cpeer,{t:'offer',sdp:pc.localDescription});
  const who=cpeer;setTimeout(()=>{if(pc&&cpeer==who&&pc.connectionState!='connected')callEnd(1)},45000)}
async function onSig(m){if(m.t=='offer'){if(cpeer)return sig(m.from,{t:'bye'});cpeer=m.from;await prof([m.from]);cq=[];coffer=m.sdp;callUI('Входящий звонок…',1);beep()}
  else if(m.t=='answer'&&pc&&m.from==cpeer){await pc.setRemoteDescription(m.sdp);cq.forEach(c=>pc.addIceCandidate(c));cq=[]}
  else if(m.t=='ice'&&m.from==cpeer){pc&&pc.remoteDescription?pc.addIceCandidate(m.c):cq.push(m.c)}
  else if(m.t=='bye'&&m.from==cpeer)callEnd(0)}
async function callAccept(){try{cstr=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast('Нет доступа к микрофону');return callEnd(1)}
  newPC();cstr.getTracks().forEach(t=>pc.addTrack(t,cstr));await pc.setRemoteDescription(coffer);cq.forEach(c=>pc.addIceCandidate(c));cq=[];
  await pc.setLocalDescription(await pc.createAnswer());sig(cpeer,{t:'answer',sdp:pc.localDescription});callUI('Соединяем…')}
function callEnd(send){if(send&&cpeer)sig(cpeer,{t:'bye'});if(pc){const p=pc;pc=null;p.close()}cstr&&cstr.getTracks().forEach(t=>t.stop());cstr=null;cpeer=null;cq=[];$('call')&&$('call').remove()}
</script>
<script>

const b64=s=>{const p='='.repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(async()=>{

async function pushOn(){
  if(!('PushManager' in window))return toast('Нет поддержки push. На iPhone: Safari → «Поделиться» → «На экран Домой», и открой оттуда');
  if(await Notification.requestPermission()!='granted')return toast('Разреши уведомления в настройках браузера');
  try{
    const reg=await navigator.serviceWorker.ready;
    const s=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID)});
    const j=s.toJSON(),{error}=await sb.rpc('save_push',{ep:j.endpoint,p:j.keys.p256dh,a:j.keys.auth});
    if(error)return fail(error);window.PUSHON=true;toast('Push включены ✅')
  }catch(e){toast('Ошибка: '+e.message)}
}

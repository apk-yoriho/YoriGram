<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YoriGram</title>
<style>
:root{--bg:#17212b;--pan:#0e1621;--acc:#5288c1;--tx:#e8eef4;--mut:#7f91a4}
html{font-size:15px}*{box-sizing:border-box}body{margin:0;font:1rem system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100dvh}
button,input,select,textarea{font:inherit;color:var(--tx)}
input,select{background:var(--pan);border:1px solid #2a3b4d;border-radius:10px;padding:10px;width:100%}
button{background:var(--acc);border:0;border-radius:10px;padding:9px 13px;cursor:pointer}button.g{background:#24303d}
.hide{display:none!important}.noanim *{animation:none!important}
#login{max-width:340px;margin:18vh auto;padding:20px;display:grid;gap:10px;text-align:center}
#app{display:grid;grid-template-columns:310px 1fr;height:100dvh}
#side{background:var(--pan);display:flex;flex-direction:column;overflow:hidden}
#side header{padding:10px;display:grid;gap:8px}.bt{display:flex;gap:6px;flex-wrap:wrap}
#list{overflow:auto;flex:1}.row{padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:center;border-bottom:1px solid #1b2836}.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#a06cd5);display:grid;place-items:center;font-weight:700;color:#fff;flex:none}.row:hover{background:#1b2836}.row small{color:var(--mut);display:block}
#chat{display:flex;flex-direction:column;min-height:0}
#top{padding:10px;background:var(--pan);display:flex;gap:8px;align-items:center}#top b{flex:1}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:8px 12px;border-radius:14px;background:#24303d;align-self:flex-start;word-break:break-word}
.m{box-shadow:0 1px 2px #0003;animation:in .2s}.m.me{background:linear-gradient(135deg,var(--acc),#6a5acd);color:#fff;align-self:flex-end}.m .t{display:block;text-align:right;font-size:.7rem;opacity:.6}@keyframes in{from{opacity:0;transform:translateY(6px)}}.m small{display:block;color:var(--mut);font-size:.8rem}.m img{max-width:100%;border-radius:10px}.m audio{max-width:100%}
.x{background:none;padding:0 4px;opacity:.5}
#bar{display:flex;gap:6px;padding:10px;background:var(--pan)}
#modal{position:fixed;inset:0;margin:auto;max-width:520px;max-height:85dvh;overflow:auto;height:fit-content;background:var(--pan);padding:16px;border-radius:16px;display:grid;gap:8px;z-index:5;box-shadow:0 0 0 100vmax #0008}
.gc{text-align:center;padding:10px;border-radius:14px;min-width:150px;background:#24303d;position:relative;overflow:hidden}
.gc .e{font-size:48px;display:block}.gc.an .e{animation:bounce 1.2s infinite}
.gc.nft{background:linear-gradient(120deg,#ff6ec4,#7873f5,#4adede,#ffd86f,#ff6ec4);background-size:300% 300%;animation:holo 4s linear infinite;color:#111}
.gc.nft .e{animation:spin 3s ease-in-out infinite}
.gc.nft:after{content:'✦ ✧ ✦ ✧ ✦';position:absolute;inset:4px;letter-spacing:18px;opacity:.7;animation:tw 1.5s infinite;pointer-events:none}
@keyframes bounce{50%{transform:translateY(-8px) scale(1.12)}}@keyframes holo{to{background-position:300% 0}}
@keyframes spin{50%{transform:rotateY(180deg) scale(1.25)}}@keyframes tw{50%{opacity:.1}}
.it{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #1b2836;padding:6px 0}
@media(max-width:700px){#app{grid-template-columns:1fr}#app.ch #side{display:none}#app:not(.ch) #chat{display:none}}
</style></head><body>

<div id="login"><h1>YoriGram</h1>
  <input id="em" type="email" placeholder="Почта">
  <input id="code" class="hide" placeholder="Код из письма" inputmode="numeric">
  <input id="pw" type="password" class="hide" placeholder="Пароль"><button id="go">Получить код</button><button class="g" id="mode">Войти с паролем</button><small id="err" style="color:#f88"></small></div>

<div id="app" class="hide">
  <div id="side"><header>
    <div class="bt"><button class="g" onclick="settings()">⚙️</button><button class="g" onclick="wallet()">✚ <span id="bal">0</span></button>
      <button class="g" onclick="newChat()">＋</button><button class="g hide" id="adm" onclick="admin()">👑</button><button class="g" id="out">Выйти</button></div>
    <input id="q" placeholder="Найти @username и нажать Enter"></header><div id="list"></div></div>
  <div id="chat" class="hide">
    <div id="top"><button class="g" id="back">←</button><b id="pn"></b>
      <button class="g hide" id="addb" onclick="addMember()">👥＋</button><button class="hide" id="giftb" onclick="pickGift()">🎁</button></div>
    <div id="msgs"></div>
    <div id="bar"><button class="g" onclick="$('file').click()">📎</button><button class="g" id="mic">🎤</button>
      <input id="txt" placeholder="Сообщение"><button id="send">➤</button>
      <input id="file" type="file" accept="image/*" class="hide"></div>
  </div>
</div>
<div id="modal" class="hide"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://kdvtfaykohjcxysblzoi.supabase.co', SUPABASE_KEY='sb_publishable_f_FofIL7StuGJRU09ZxFqA_bALqSf0t';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let me,cur,chats=[],gifts={},pmap={};
const S=JSON.parse(localStorage.ys||'{}');
function applyS(){const T={dark:['#17212b','#0e1621','#e8eef4'],light:['#eef2f6','#ffffff','#111'],blue:['#0b1d3a','#081428','#e8f0ff']}[S.th||'dark'],r=document.documentElement.style;
  r.setProperty('--bg',T[0]);r.setProperty('--pan',T[1]);r.setProperty('--tx',T[2]);r.setProperty('--acc',S.acc||'#5288c1');r.fontSize=(S.fs||15)+'px';document.body.classList.toggle('noanim',!!S.na)}
applyS();
const modal=h=>{$('modal').innerHTML=h+'<button class="g" onclick="closeM()">Закрыть</button>';$('modal').classList.remove('hide')};
const closeM=()=>$('modal').classList.add('hide');
const nm=p=>p?(p.display_name||'@'+p.username):'?';
const url=p=>sb.storage.from('media').getPublicUrl(p).data.publicUrl;
const fail=e=>alert(/balance/.test(e.message)?'Не хватает крестиков':e.message);

let pwMode=false;
$('mode').onclick=()=>{pwMode=!pwMode;$('pw').classList.toggle('hide',!pwMode);$('code').classList.add('hide');$('go').textContent=pwMode?'Войти':'Получить код';$('mode').textContent=pwMode?'Войти по коду из почты':'Войти с паролем'};
$('go').onclick=async()=>{$('err').textContent='';const email=$('em').value.trim();
  if(pwMode){const {error}=await sb.auth.signInWithPassword({email,password:$('pw').value});if(error)return $('err').textContent='Неверная почта или пароль';return start()}
  if($('code').classList.contains('hide')){const {error}=await sb.auth.signInWithOtp({email});
    if(error)return $('err').textContent=error.message;$('code').classList.remove('hide');$('go').textContent='Войти'}
  else{const {error}=await sb.auth.verifyOtp({email,token:$('code').value.trim(),type:'email'});
    if(error)return $('err').textContent=error.message;start()}};
$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};

async function start(){
  $('login').classList.add('hide');$('app').classList.remove('hide');
  const {data:g}=await sb.from('gifts').select().order('price');g.forEach(x=>gifts[x.id]=x);
  await loadMe();await loadChats();
  sb.channel('m').on('postgres_changes',{event:'*',schema:'public',table:'messages'},p=>{loadChats();if(cur)loadMsgs()})
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'members'},()=>loadChats()).subscribe();
}
async function loadMe(){const {data}=await sb.rpc('me');me=data;$('bal').textContent=me.balance;$('adm').classList.toggle('hide',!me.is_admin)}
async function prof(ids){const n=[...new Set(ids)].filter(i=>i&&!pmap[i]);if(!n.length)return;
  const {data}=await sb.from('profiles').select('id,username,display_name').in('id',n);data.forEach(p=>pmap[p.id]=p)}

async function loadChats(){
  const {data}=await sb.from('members').select('chats(id,kind,title,owner)').eq('user_id',me.id);
  chats=data.map(x=>x.chats).filter(Boolean).sort((a,b)=>b.id-a.id);
  const dm=chats.filter(c=>c.kind=='dm').map(c=>c.id);
  if(dm.length){const {data:o}=await sb.from('members').select('chat_id,user_id').in('chat_id',dm).neq('user_id',me.id);
    await prof(o.map(x=>x.user_id));o.forEach(x=>{const c=chats.find(c=>c.id==x.chat_id);if(c)c.peer=x.user_id})}
  $('list').innerHTML='';
  chats.forEach(c=>{const r=document.createElement('div');r.className='row';
    const ic={dm:'👤',group:'👥',channel:'📢'}[c.kind];
    const t=c.kind=='dm'?nm(pmap[c.peer]):c.title;r.innerHTML=`<span class="av">${esc(((t||'?').trim()[0]||'?').toUpperCase())}</span><b>${ic} ${esc(t)}</b>`;r.onclick=()=>openChat(c);$('list').append(r)});
}
$('q').onkeydown=async e=>{if(e.key!='Enter')return;const u=$('q').value.trim().replace(/^@/,'').toLowerCase();
  const {data}=await sb.from('profiles').select('id').eq('username',u).maybeSingle();
  if(!data)return alert('Не найден');if(data.id==me.id)return alert('Это ты');
  const {data:cid,error}=await sb.rpc('start_dm',{other:data.id});if(error)return fail(error);
  $('q').value='';await loadChats();openChat(chats.find(c=>c.id==cid))};

function openChat(c){cur=c;$('pn').textContent=c.kind=='dm'?nm(pmap[c.peer]):c.title;
  $('chat').classList.remove('hide');$('app').classList.add('ch');
  $('giftb').classList.toggle('hide',c.kind!='dm');$('addb').classList.toggle('hide',!(c.kind!='dm'&&(c.owner==me.id||me.is_admin)));
  $('bar').classList.toggle('hide',c.kind=='channel'&&c.owner!=me.id);loadMsgs()}
$('back').onclick=()=>{cur=null;$('app').classList.remove('ch');$('chat').classList.add('hide')};
const card=(g,u)=>{const n=u&&u.upgraded;
  return `<div class="gc ${n?'nft':g.animated?'an':''}"><span class="e">${n?'🎆':g.emoji}</span><b>${esc(g.name)}</b>
  <div>${n?`NFT #${u.serial}/${g.supply}`:g.supply?`лимитка ${u?'#'+u.serial+'/':'осталось '}${u?g.supply:g.supply-g.sold}`:g.price+' ✚'}</div></div>`};

async function loadMsgs(){
  const id=cur.id;const {data}=await sb.from('messages').select().eq('chat_id',id).order('id').limit(200);
  if(!cur||cur.id!=id)return;await prof(data.map(m=>m.sender));
  const ids=data.map(m=>m.user_gift_id).filter(Boolean);let ug={};
  if(ids.length){const {data:u}=await sb.from('user_gifts').select().in('id',ids);u.forEach(x=>ug[x.id]=x)}
  $('msgs').innerHTML='';
  data.forEach(m=>{const d=document.createElement('div');d.className='m'+(m.sender==me.id?' me':'');
    let h=cur.kind!='dm'&&m.sender!=me.id?`<small>${esc(nm(pmap[m.sender]))}</small>`:'';
    if(m.kind=='text')h+=esc(m.body);
    else if(m.kind=='photo')h+=`<img src="${url(m.media_path)}">`;
    else if(m.kind=='voice')h+=`<audio controls src="${url(m.media_path)}"></audio>`;
    else{const u=ug[m.user_gift_id];h+=u?card(gifts[u.gift_id],u):'🎁'}
    if(m.sender==me.id||me.is_admin)h+=` <button class="x" onclick="del(${m.id})">✕</button>`;
    h+=`<span class="t">${new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>`;
    d.innerHTML=h;$('msgs').append(d)});
  $('msgs').scrollTop=1e9;
}
const del=async id=>{await sb.from('messages').delete().eq('id',id);loadMsgs()};
async function put(body,kind='text',path=null){const {error}=await sb.from('messages').insert({chat_id:cur.id,sender:me.id,kind,body,media_path:path});if(error)fail(error)}
const send=async()=>{const b=$('txt').value.trim();if(!b||!cur)return;$('txt').value='';put(b)};
$('send').onclick=send;$('txt').onkeydown=e=>{if(e.key=='Enter')send()};
async function upload(blob,ext){const p=`${me.id}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error}=await sb.storage.from('media').upload(p,blob,{contentType:blob.type});if(error){fail(error);return null}return p}
$('file').onchange=async e=>{const f=e.target.files[0];if(!f||!cur)return;const p=await upload(f,f.name.split('.').pop()||'jpg');if(p)put('','photo',p);e.target.value=''};
let rec,chunks;
$('mic').onclick=async()=>{
  if(rec&&rec.state=='recording'){rec.stop();return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(st);chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=async()=>{st.getTracks().forEach(t=>t.stop());$('mic').textContent='🎤';
      const b=new Blob(chunks,{type:rec.mimeType});const p=await upload(b,/mp4/.test(rec.mimeType)?'m4a':'webm');if(p)put('','voice',p)};
    rec.start();$('mic').textContent='⏹ стоп'}catch(e){alert('Нет доступа к микрофону')}};

function pickGift(){modal('<b>Подарок</b>'+Object.values(gifts).map(g=>{const out=g.supply&&g.sold>=g.supply;
  return `<div class="it">${card(g,null)}<button ${out?'disabled':''} onclick="sendGift(${g.id})">${out?'Нет в наличии':'Подарить за '+g.price+' ✚'}</button></div>`}).join(''))}
async function sendGift(id){const {error}=await sb.rpc('send_gift',{to_user:cur.peer,gift:id});if(error)return fail(error);closeM();loadMe()}

async function wallet(){await loadMe();
  const {data:mine}=await sb.from('user_gifts').select().eq('owner',me.id).order('id',{ascending:false});
  const {data:mk}=await sb.from('user_gifts').select().not('sale_price','is',null).neq('owner',me.id);
  modal(`<b>Крестики: ✚ ${me.balance}</b><small>Пополнить пока может только владелец.</small><b>Мои подарки</b>`+
   (mine.length?mine.map(u=>{const g=gifts[u.gift_id];return `<div class="it">${card(g,u)}<span>`+
     (!u.upgraded&&g.upgrade_price?`<button onclick="upg(${u.id})">Улучшить до NFT · ${g.upgrade_price} ✚</button>`:'')+
     (u.upgraded?(u.sale_price?`<button class="g" onclick="lst(${u.id},0)">Снять (${u.sale_price} ✚)</button>`:`<button onclick="lst(${u.id})">Продать</button>`):'')+
     `</span></div>`}).join(''):'<small>Пусто</small>')+
   `<b>Рынок NFT</b>`+(mk.length?mk.map(u=>`<div class="it">${card(gifts[u.gift_id],u)}<button onclick="buy(${u.id})">Купить · ${u.sale_price} ✚</button></div>`).join(''):'<small>Пока ничего не продаётся</small>'))}
const act=async(f,a)=>{const {error}=await sb.rpc(f,a);if(error)return fail(error);wallet()};
const upg=id=>act('upgrade_gift',{ug:id});const buy=id=>act('buy_gift',{ug:id});
const lst=(id,p)=>{const v=p===0?0:+prompt('Цена в крестиках:');if(v>=0)act('list_gift',{ug:id,price:v})};

function settings(){modal(`<b>Настройки</b><input id="sn" placeholder="Имя" value="${esc(me.display_name)}"><input id="su" placeholder="username" value="${esc(me.username)}">
  <input id="sb" placeholder="О себе" value="${esc(me.bio)}"><input id="sp" placeholder="Телефон" value="${esc(me.phone)}">
  <select id="th"><option value="dark">Тёмная тема</option><option value="light">Светлая</option><option value="blue">Синяя</option></select>
  <label>Цвет акцента <input id="ac" type="color" value="${S.acc||'#5288c1'}"></label>
  <label>Размер текста <input id="fs" type="range" min="13" max="20" value="${S.fs||15}"></label>
  <label><input id="na" type="checkbox" style="width:auto" ${S.na?'checked':''}> Отключить анимации</label><button onclick="saveS()">Сохранить</button>`);$('th').value=S.th||'dark'}
async function saveS(){Object.assign(S,{th:$('th').value,acc:$('ac').value,fs:+$('fs').value,na:$('na').checked});localStorage.ys=JSON.stringify(S);applyS();
  const {error}=await sb.from('profiles').update({display_name:$('sn').value,username:$('su').value.toLowerCase(),bio:$('sb').value,phone:$('sp').value}).eq('id',me.id);
  if(error)return alert(/unique/.test(error.message)?'Username занят':error.message);closeM();loadMe().then(()=>pmap[me.id]=null)}

function newChat(){modal(`<b>Новый чат</b><select id="nk"><option value="group">Группа</option><option value="channel">Канал</option></select>
  <input id="nt" placeholder="Название"><button onclick="mk()">Создать</button>`)}
async function mk(){const {data,error}=await sb.rpc('create_chat',{k:$('nk').value,t:$('nt').value});if(error)return fail(error);closeM();await loadChats();openChat(chats.find(c=>c.id==data))}
async function addMember(){const u=prompt('@username участника:');if(!u)return;const {error}=await sb.rpc('add_member',{cid:cur.id,uname:u.replace('@','')});if(error)fail(error);else alert('Добавлен')}

function admin(){modal(`<b>👑 Панель владельца</b><input id="au" placeholder="@username"><input id="aa" type="number" placeholder="Сколько крестиков (можно минус)">
  <button onclick="ag()">Выдать / списать крестики</button><button class="g" onclick="ad()">Удалить пользователя</button>
  <small>Удалять любые сообщения можно кнопкой ✕ в чате.</small>`)}
async function ag(){const {error}=await sb.rpc('admin_give',{uname:$('au').value.replace('@',''),amount:+$('aa').value});error?fail(error):(alert('Готово'),loadMe())}
async function ad(){if(!confirm('Удалить пользователя насовсем?'))return;const {error}=await sb.rpc('admin_delete_user',{uname:$('au').value.replace('@','')});error?fail(error):alert('Удалён')}

sb.auth.getSession().then(({data})=>data.session&&start());
</script></body></html>
